            // 正因为两头都要，本面板不再走 onCommand 回调注入（见类头注释）
            this.transport = opts.transport;
            this.revealPanel = opts.revealPanel || null;  // 发送开始时切到本面板（入口注入）
            this.setTransferLock = opts.setTransferLock || null;  // 发送期间锁死其它交互
            this._sentBytes = 0;          // 累计交给 sendFrame 的字节：本地估算的上界
            this._chunkSize = 0;          // 本次传输的块大小：进度只允许 ack 领先至多一块
            this._endWaitDone = null;     // end 确认等待的结算句柄（见 _waitEndAck）；null = 无人在等
            this._tx = null;              // 本次传输的 AbortController：取消/收尾时 abort，见 _waitChunkAck

            this._id = 0;            // 传输会话 id：每连接从 1 递增（协议 §9）
            this._state = 'idle';    // idle | sending | canceling（等取消回执）
            this._kind = 'file';     // 当前传输类型：'file' 落盘 | 'photo' 到剪贴板
            this._file = null;       // 发送中的 File（取消/出错时留作重发）
            this._cancelRequested = false;
            this._pendingKind = null;  // 选择器在飞时的传输类型：非 null 表示「等结果」
            this._cancelTimer = null;  // 「取消」判定计时器（见 _bind）

            this._injectStyles();
            this._buildDOM();
            this._bind();

            // 下行 ack（协议 §9）：data 块逐块回，end 收齐落盘后再回一帧。
            // **取消回执不在这里处理** —— 它由 _awaitCancelAck 在「正在等回执」那一次
            // 等待里自己订阅，订阅只活那一段时间（这正是多订阅者总线换来的写法）。
            this.transport.on('ack', (f) => {
                if (f.ref !== this._kind || f.id !== this._id) return;
                if (f.a === 'end') {
                    // 唯一能报成功的依据：PC 已落盘改名。先把进度补满再收尾
                    this._endConfirmed = true;
                    if (this._file) this._updateProgress(this._file.size);
                    this._resolveEnd(true);
                    return;
                }
                if (f.a !== 'data') return;
                // data 级 ack：补上本端观测不到的那一段——数据真的到 PC 了
                if (typeof f.received === 'number') {
                    this._ackedBytes = Math.max(this._ackedBytes, f.received);
                }
                // 停等闸门的放行依据是**块序号**：尾块不满，received 推不出块号
                if (typeof f.n === 'number') {
                    this._ackedChunkN = Math.max(this._ackedChunkN, f.n);
                    this._recordAck(f.n, this._ackedBytes);   // 记每块 ack 时刻，推算端到端速率
                }
                this._progressTick();
            });
            // 下行 error：PC 端拒收（字段非法/已有传输占线/校验失败）→ 视为失败收尾
            this.transport.on('error', () => {
                // 正在等 end 确认：走那一次等待自己的结算出口（与 _cancel 同一条路），
                // 否则 _start 会永远挂在 await 上（气泡虽然对了，挂着的那个 await 是漏的）
                if (this._endWaitDone) { this._resolveEnd(false); return; }
                if (this._state === 'sending') this._finish(false);
            });
        }

        _injectStyles() {
            if (document.getElementById('file-panel-styles')) return;
            const style = document.createElement('style');
            style.id = 'file-panel-styles';
            style.textContent = FilePanel.STYLES;
            document.head.appendChild(style);
        }

        _buildDOM() {
            this.root.innerHTML = `
                <div class="file-panel">
                    <div class="fp-pick">
                        <button type="button" data-fp="doc">
                            <span class="ico">📄</span><span data-i18n="panel_file_doc"></span>
                            <span class="fp-sub" data-i18n="panel_file_doc_hint"></span>
                        </button>
                        <button type="button" data-fp="image">
                            <span class="ico">🖼️</span><span data-i18n="panel_file_image"></span>
                            <span class="fp-sub" data-i18n="panel_file_image_hint"></span>
                        </button>
                        <input type="file" class="fp-input" hidden>
                    </div>
                    <div class="fp-progress" hidden>
                        <div class="fp-name"></div>
                        <div class="fp-bar"><div class="fp-fill"></div></div>
                        <div class="fp-pct">0%</div>
                        <div class="fp-speed"></div>
                        <button type="button" class="fp-cancel" data-i18n="panel_file_cancel"></button>
                    </div>
                    <div class="pv-hint" data-i18n="panel_hint_file"></div>
                </div>`;
            // 语言包已由 loadI18n() 就绪，统一回填 data-i18n 文案（与其他面板同套路）
            this.root.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            this.pickRow = this.root.querySelector('.fp-pick');
            this.progressBox = this.root.querySelector('.fp-progress');
            this.fileInput = this.root.querySelector('.fp-input');
            this.nameEl = this.root.querySelector('.fp-name');
            this.fillEl = this.root.querySelector('.fp-fill');
            this.pctEl = this.root.querySelector('.fp-pct');
            this.speedEl = this.root.querySelector('.fp-speed');
            this.cancelBtn = this.root.querySelector('.fp-cancel');
        }

        _bind() {
            // 按钮决定传输类型：图片 → 剪贴板(photo)，文件 → 磁盘(file)
            const pickKind = (kind) => {
                if (this._state !== 'idle') return;
                this._pendingKind = kind;
                this.fileInput.accept = kind === 'photo' ? 'image/*' : '';
                // 唤起选择器会把 WebView 送回后台（Android 可能顺手掐掉 WebSocket）。
                // 记下这一刻，断连时才能和 [LIFE] 事件对上到底是哪一步掉的线；
                // 同时告诉 wsClient：接下来这段断连属于「选择器造成的」，才配走静默窗口。
                console.info(`[FILE] 打开选择器 kind=${kind}`, PhoneLog.snap());
                this.transport.beginPickerContext();
                this.fileInput.click();
            };
            this.pickRow.querySelector('[data-fp="image"]').addEventListener('click', () => pickKind('photo'));
            this.pickRow.querySelector('[data-fp="doc"]').addEventListener('click', () => pickKind('file'));
            this.fileInput.addEventListener('change', () => {
                const f = this.fileInput.files && this.fileInput.files[0];
                this.fileInput.value = '';   // 允许下次选同一个文件仍触发 change
                const kind = this._pendingKind || 'file';
                this._pendingKind = null;    // 有 change 就是「有结果了」，取消检测到此为止
                if (f) {
                    this.transport.endPickerContext();
                    console.info(`[FILE] 已选择 ${f.name} size=${f.size}`, PhoneLog.snap());
                    this._start(f, kind);
                } else {
                    // 少数浏览器「取消」也会发 change（files 为空）：按取消处理
                    console.info('[FILE] 选择器取消');
                    this.transport.cancelPickerContext();
                }
            });
            this.root.querySelector('.fp-cancel').addEventListener('click', () => this._cancel());

            // 「取消」不保证有事件可依赖（多数 Android WebView 干脆一个都不发），所以靠
            // 「回到前台后短时间内等不到 change」来判定：等到了 = 点了确定，等不到 = 取消。
            // 取消要照常上报断开，见 wsClient.cancelPickerContext。
            document.addEventListener('visibilitychange', () => {
                if (document.hidden || !this._pendingKind) return;
                clearTimeout(this._cancelTimer);
                this._cancelTimer = setTimeout(() => {
                    this._cancelTimer = null;
                    if (!this._pendingKind) return;   // 期间 change 到了 = 点了确定
                    this._pendingKind = null;
                    console.info('[FILE] 选择器取消（回前台后无 change）');
                    this.transport.cancelPickerContext();
                }, FilePanel.PICKER_CANCEL_GRACE);
            });
        }

        /** 外部重发入口（消息气泡点击）：重新发送同一文件（仅 file 可重发） */
        resend(file) {
            if (this._state === 'idle') this._start(file, 'file');
        }

        /** 结果气泡文案键：photo 与 file 各自一套（bubble_photo_* / bubble_file_*） */
        _bubbleKey(base) {
            return this._kind === 'photo' ? 'bubble_photo_' + base : 'bubble_file_' + base;
        }

        async _start(file, kind = 'file') {
            if (this._state !== 'idle') return;   // sending / waiting 期间不接受新的发送请求
            // 「未连接」多数是个瞬时态：断线后 1s 内就会重连好，而唤起文件选择器本身
            // 会把 WebView 送回后台、Android 常顺手掐掉 socket（两端只剩一个 1006），
            // 选完文件回到前台时连接正处在这个重连窗口里。
            // 所以先等一会儿（而不是立刻报未连接），等到了就直接发。
            if (!this.transport.getConnected()) {
                this._state = 'waiting';
                console.info('[FILE] 连接未就绪，先等重连…', PhoneLog.snap());
                const ok = await this.transport.whenReady(FilePanel.RECONNECT_WAIT);
                this._state = 'idle';
                if (!ok) {
                    // 顺手把关闭现场带出来：否则手机上只能看到「未连接」，无从定位
                    showToast(t('panel_file_disconnected'),
                              WS_DIAG ? this.transport.diagText() : '', 8000);
                    return;
                }
                console.info('[FILE] 重连成功，继续发送');
            }

            this._id += 1;
            this._kind = kind;               // 'file' → 磁盘；'photo' → 剪贴板
            this._file = file;
            this._cancelRequested = false;
            this._sentBytes = 0;
            this._ackedBytes = 0;
            this._ackedChunkN = -1;      // -1 = 一块都没被 ack（停等闸门基线，见 _waitChunkAck）
            this._gateGaveUp = false;    // ack 通道失灵后退回流水线，见 _waitChunkAck
            this._ackLog = new Map();    // 每块 data ack 的 {received, t}，用于推算端到端速率
            this._speed = 0;             // 当前端到端速率（字节/秒），见 _recordAck / _renderSpeed
            this._shownPct = 0;
            this._endConfirmed = false;
            this._awaitingAck = false;
            // 本次传输的作用域：abort 一次，在飞的等待（停等闸门）就地退出、订阅一并退掉。
            // 取消与收尾各 abort 一次，谁先到都行 —— 等待的结算本身是幂等的。
            this._tx = new AbortController();
            this._state = 'sending';
            this._startT = performance.now();   // 全程平均速率基线：从真正开始发送那一刻计时
            this._setLock(true);          // 传输期间锁死面板切换与其它操作

            // 发送期间需要看到进度与取消：若附件面板收起/在别的 tab，先切回本面板
            if (this.revealPanel) this.revealPanel();

            // 切到进度态：选择区锁定（仅取消可点）
            this.pickRow.style.display = 'none';
            this.progressBox.hidden = false;
            this.nameEl.textContent = file.name;
            this._updateProgress(0);

            const chunkSize = FilePanel.pickChunkSize(file.size);   // 按体积自适应 ~12 块，上限随链路 CHUNK_MAX（§9）
            this._chunkSize = chunkSize;   // 进度只允许 ack 领先至多一块（见 _progressTick）
            const total = Math.ceil(file.size / chunkSize);
            // 帧 type 随传输类型（wire-protocol.md §9：file/photo 线格式相同）
            // ⚠️ start 是**唯一没有兜底**的帧出口，必须看返回值：上面那次 getConnected()
            // 只是上一刻的快照，而此刻还没有任何订阅能替它兜底。发丢的后果不只是「服务端
            // 收不到 start」——断连重连后 data 会打到已被 abort_all() 清掉的会话（会话按
            // id 全局路由），服务端回 error(malformed)，用户看到一次连 .part 都没建起来的
            // 无理由失败。就地失败收尾，不进发送循环。
            if (!this.transport.sendFrame({ type: kind, a: 'start', id: this._id,
                                            name: file.name, size: file.size, chunks: total })) {
                console.warn('[FILE] start 帧未发出（连接已断），就地失败收尾');
                this._finish(false);
                return;
            }

            for (let n = 0; n < total; n++) {
                if (this._cancelRequested) return;   // 用户已取消，_cancel 负责收尾
                if (!this.transport.getConnected()) { this._finish(false); return; }
                // 滑动窗口闸门：在途未确认块数不得超过 MAX_INFLIGHT（=1 即「收到上一块 ack 才发下一帧」，>1 即允许 N 块同时在途）
                if (!(await this._waitChunkAck(n - FilePanel.MAX_INFLIGHT))) {
                    if (this._cancelRequested) return;             // 用户已取消：_cancel 负责收尾
                    if (this._state === 'sending') this._finish(false);   // 断连：ACK 不会再来
                    return;
                }
                try {
                    const blob = file.slice(n * chunkSize, (n + 1) * chunkSize);
                    const buf = await blob.arrayBuffer();
                    const bytes = new Uint8Array(buf);
                    const ok = this.transport.sendFrame({ type: kind, a: 'data', id: this._id, n, chunk: bytes });
                    if (!ok) { this._finish(false); return; }   // 连接断开，sendFrame 静默 false
                    this._sentBytes += bytes.length;
                    this._progressTick();                       // 按 ack 基准推进（本地量只做至多一块的前瞻）
                    await this._waitDrain();                    // 积压过高时背压等待（期间持续刷新进度）
                } catch (e) {
                    console.error('[FILE] read/send chunk failed:', e);
                    this.transport.sendFrame({ type: kind, a: 'cancel', id: this._id });
                    this._finish(false);
                    return;
                }
            }

            if (this._cancelRequested) return;
            this._progressTick();                    // 数据已全部交出：本地量也不再增长（等 ack 收尾）
            this._awaitingAck = true;
            this._renderPct();                       // 文案切「等待电脑确认…」
            this.transport.sendFrame({ type: kind, a: 'end', id: this._id });
            // 等 PC 端确认落盘再报成功：没等到就如实报「未确认」，绝不猜成功
            const result = await this._waitEndAck(kind, this._id);
            this._awaitingAck = false;
            this._finish(result);
        }

        /**
         * 进度 = PC 已确认字节 + 至多 MAX_INFLIGHT 块的「乐观量」，见协议 §9。
         *
         * 真实交付量被有序信道夹在两个可观测边界之间：
         *   下界 ackedBytes           —— PC 已落盘，板上钉钉
         *   上界 sentBytes − buffered —— 已交到网络栈；再往后（手机内核、无线在途、
         *                                CF 回源、PC 内核、uvicorn、写盘）本端全是盲区
         * 取上界就会重演「手机→CF 快、CF→PC 慢时进度条瞬间满格」的假进度
         * （`max()` 也只是取上界，同样不管它跑多远）。
         * 所以取下界为基准，只允许领先至多一块——既不说谎，又能吃掉一块的在途
         * 与 ack 回程延迟，避免 ack 未到时长时间停顿。
         */
        _progressTick() {
            const buffered = this.transport.bufferedAmount();
            const backlog = Math.max(0, this._sentBytes - buffered - this._ackedBytes);
            this._updateProgress(this._ackedBytes + Math.min(backlog, this._chunkSize));
        }

        /** 兜底背压（主线是 _waitChunkAck 的停等）：积压超 HIGH_WATER 就等它降到 LOW_WATER */
        _waitDrain() {
            const buffered = () => this.transport.bufferedAmount();
            if (buffered() <= FilePanel.HIGH_WATER) return Promise.resolve();
            return new Promise((resolve) => {
                const tick = () => {
                    // bufferedAmount 缺失（非标准实现/mock）时按 0 处理，避免永远等下去
                    this._progressTick();   // 背压等待期间持续按 ack 刷新进度
                    if (this._cancelRequested || !this.transport.isOpen() ||
                        buffered() <= FilePanel.LOW_WATER) {
                        resolve();
                        return;
                    }
                    setTimeout(tick, 20);
                };
                setTimeout(tick, 20);
            });
        }

        /**
         * 停等闸门：等「第 k 块已被 ack」，k < 0 或已达标记立即放行。
         *
         * **为什么必须有它**：`_waitDrain` 只看 `bufferedAmount`，而它只覆盖「浏览器 → 网络栈」
         * 这一段。数据一旦离开浏览器，手机内核 socket 缓冲、无线在途、CF 回源、PC 内核、
         * uvicorn、写盘全是本端盲区 —— 于是浏览器侧可以一路「发得出去」而链路早已积压，
         * 表现为 `bufferedAmount ≈ 0` 却传得极慢、且取消后很久才停。等对端 ack 才是真正
         * **端到端**的节流：在途量被钉死在 MAX_INFLIGHT 块以内（=1 时即「收到上一块的 ack
         * 才允许发下一帧」）。副作用是取消延迟从「在途积压 ÷ 吞吐」降到「1 块 ÷ 吞吐」
         * ——CF 上实测就是 8~10s，这个量级直接决定了 CANCEL_ACK_TIMEOUT 该取多大（见 LINK）。
         *
         * **代价**：吞吐上限 ≈ MAX_INFLIGHT × 块大小 ÷ (单向传输 + RTT)。局域网上 1MB 一块
         * 几乎无感；Cloudflare 上瓶颈是**上行带宽**而非 RTT（实测 256KB 一块要 8~10s），
         * 那时停等并不吃亏——链路本身就是瓶颈。想更快就调大 MAX_INFLIGHT（那仍是
         * 「在途 ≤ N 块」的滑动窗口，不是退回无节制流水线）。
         *
         * 返回 true（已放行，含超时降级）/ false（已取消或断连，交给收尾路径）。
         * 超时**只降级一次**：ack 通道若失灵，整体退回流水线，而不是把传输拖成「1 块 / 超时」。
         * 超时值随链路取（`LINK.chunkAck`）：CF 上一块本身就要 8~10s 才走完，用局域网的
         * 15s 会在正常等待里误降级 —— 那等于白丢了停等带来的节流。
         *
         * **唤醒源全是事件，一条轮询都没有**：放行看 ack 帧自己（认块号 `n`，不认 `received`
         * ——尾块不满时由 received 反推不出块号）；取消/收尾看本次传输的 AbortController
         * （`_tx`，见 _cancel / _finish）；断连看 `WS_CLOSE`。三条路「到了就醒」。
         */
        _waitChunkAck(k) {
            if (k < 0 || this._gateGaveUp || this._ackedChunkN >= k) return Promise.resolve(true);
            const limit = FilePanel.CHUNK_ACK_TIMEOUT;   // 起等时定死：超时随链路取，见 LINK
            return new Promise((resolve) => {
                const ac = new AbortController();
                let timer = null;
                // 纯观感：进度条「一块之内的前瞻」靠的是 bufferedAmount 在慢慢排空，
                // 不刷新就只会在每块 ack 时跳一格（CF 上一格 = 8~10s，看着像卡死）。
                // 这个定时器**只画图、不决策** —— 放行与失败全由下面的订阅决定。
                const paint = setInterval(() => this._progressTick(), 100);
                let done = false;
                const settle = (ok) => {
                    if (done) return;    // 幂等：abort 与帧通知可能先后到达
                    done = true;
                    clearTimeout(timer);
                    clearInterval(paint);
                    ac.abort();          // 一次退订本次等待挂上的全部订阅
                    resolve(ok);
                };
                this.transport.on('ack', (f) => {
                    if (f.ref !== this._kind || f.id !== this._id) return;
                    if (typeof f.n === 'number' && f.n >= k) settle(true);
                }, { signal: ac.signal });
                this.transport.on(WS_CLOSE, () => settle(false), { signal: ac.signal });
                if (this._tx) {
                    this._tx.signal.addEventListener('abort', () => settle(false), { once: true });
                }
                timer = setTimeout(() => {
                    console.warn('[FILE] 等块 ack 超时，停等降级为流水线（ack 通道疑似失灵）');
                    this._gateGaveUp = true;
                    settle(true);
                }, limit);
            });
        }

        /**
         * 等 PC 端对 end 的确认。出口只有三个，**永远不会把「没等到」当成成功**：
         *   true      —— 收到 ack(a:"end")：PC 已落盘改名，板上钉钉
         *   false     —— 收到 error 帧、连接断开，或用户取消（_cancel 也调这里）
         *   'unknown' —— 保险超时：连接还在，但 PC 一直没表态，如实报「未确认」
         *
         * 三个出口都是**事件到达就结算**，连「250ms 问一次 getConnected()」那种轮询都不需要
         * —— 断连有 `WS_CLOSE` 专门通知。保险超时只用来兜「PC 压根不回」这种异常，
         * 正常落盘远快于它（等待期间逐块 ack 仍在刷新进度条，用户看得见它在动）。
         *
         * `_endWaitDone` 是这一次等待的结算句柄：下行 error 与 `_cancel` 都从它进来，
         * 保证无论走哪条路都只结算一次（按引用比对，后到的路径直接作废）。
         */
        _waitEndAck(kind, id) {
            return new Promise((resolve) => {
                const ac = new AbortController();
                let timer = null;
                const settle = (result) => {
                    if (this._endWaitDone !== settle) return;   // 已由别的路径结算
                    this._endWaitDone = null;
                    clearTimeout(timer);
                    ac.abort();
                    resolve(result);
                };
                this._endWaitDone = settle;
                this.transport.on('ack', (f) => {
                    if (f.ref === kind && f.id === id && f.a === 'end') settle(true);
                }, { signal: ac.signal });
                this.transport.on(WS_CLOSE, () => settle(false), { signal: ac.signal });
                timer = setTimeout(() => settle('unknown'), FilePanel.END_ACK_TIMEOUT);
            });
        }

        /** 从别的路径结算 end 等待（收到 error / 用户取消）。无人在等时是空操作。 */
        _resolveEnd(result) {
            if (this._endWaitDone) this._endWaitDone(result);
        }

        _setLock(locked) {
            if (this.setTransferLock) this.setTransferLock(locked);
        }

        /**
         * 用户点「取消」。**界面不立刻解锁**——等服务端回执（见 _awaitCancelAck）
         * 才恢复可用：本地停发只说明「我不再发了」，服务端那边可能还在收队列里
         * 的残留块、还在写 .part，此时解锁会让用户以为已经干净了。
         *
         * 顺序上有两处不能颠倒（都是踩过或差点踩到的）：
         *   ① `_state` 早于发帧就推成 'canceling' —— 这样重入守卫只剩 `_state` 一个字段，
         *      不必再维护一个与它同生共死的 `_cancelPending`；
         *   ② **先挂取消回执的订阅，再发 cancel 帧** —— 局域网一个来回只要几毫秒，
         *      先发后订会漏掉回执，界面白白锁到超时才解锁。
         */
        _cancel() {
            if (this._state !== 'sending') return;   // 在飞时 _state 已是 'canceling'，重复点击自然被挡
            const kind = this._kind;
            const id = this._id;
            const file = this._file;

            this._cancelRequested = true;     // 立刻停发：发送循环与各处等待都据此退出
            this._state = 'canceling';        // 见上面 ①
            // 唤醒在飞的等待：停等闸门与 end 确认都没必要再等下去了
            if (this._tx) this._tx.abort();
            this._resolveEnd(false);

            const waiting = this._awaitCancelAck(kind, id);   // 见上面 ②：订阅已经挂好
            this.transport.sendFrame({ type: kind, a: 'cancel', id });   // file 删 .part、photo 丢 buffer（§9）

            this._file = null;         // 摘掉：_start 的 _finish 见 file 为空则直接退出，不重复收尾
            this._renderCancelPending();

            waiting.then(() => {
                this._resetUI();
                this._state = 'idle';
                this._setLock(false);   // 到这里界面才恢复可用
                // 灰色气泡入聊天记录：file 可点重发；photo 纯结果展示不可重发
                const ref = kind === 'file' ? file : null;
                this.chat.addFileMessage(t(this._bubbleKey('canceled'), { name: file.name }), 'cancel', ref, kind);
            });
        }

        /**
         * 等「取消已生效」的确认。三级，逐级放宽，但**一定有终点**：
         *
         *   ① `ack(a:"cancel")` —— 服务端已丢弃会话，板上钉钉；
         *   ② `hello` 回执      —— ①超时后改发一帧 `hello`；回执能回来就说明排在它
         *                          之前的 `cancel` 帧已被服务端从 socket 读出（同一条
         *                          可靠有序通道，服务端按收帧顺序处理），据此判定取消
         *                          已送达。号取本次传输的 `id`、回执还要比对 `t`，且订阅
         *                          就地挂在发帧之前（见 `probe`），故上一次取消的迟到
         *                          回执不会冒充本次的；
         *   ③ 硬超时 / 断连      —— 不能再干等：放行界面。此时连接若已断，服务端侧的
         *                          会话也会随连接一起清掉（`abort_all`）。
         *
         * 三种出口都会放行界面且有日志，不会把用户永久锁在「正在取消」里。
         *
         * ①② 的时限随链路取（`LINK.cancelAck` / `LINK.hello`）。CF 上这一步**注定要等**：
         * 取消帧排在已交出去的字节后面（停等把在途压到 1 块，256KB 实测也要 8~10s 才排空），
         * 所以该等 15~20s；局域网最多几毫秒，等 3s 都嫌多。
         */
        _awaitCancelAck(kind, id) {
            const ackLimit = FilePanel.CANCEL_ACK_TIMEOUT;   // 起等时定死，见 LINK
            const helloLimit = FilePanel.HELLO_TIMEOUT;
            return new Promise((resolve) => {
                const ac = new AbortController();
                let timer = null;
                const finish = (how) => {
                    clearTimeout(timer);
                    ac.abort();     // 一次退订本次等待挂上的全部订阅
                    resolve(how);
                };
                const probe = () => {
                    // 认号不认帧。号取**本次传输的 `id`**：取消会在同一条连接上反复发生，
                    // 必须拿一个「晚于本次 cancel 发出」的凭证，否则上一次取消的迟到回执会
                    // 冒充本次的——它证明的只是上一次的 cancel 已被读出。`id` 在连接内单调
                    // 递增、每次传输唯一，天然跨次不重复，不必另立一个计数器。
                    //
                    // 订阅**就地挂在发帧之前**，于是「探活发出去没有」不必再记：订阅存在
                    // 本身就等价于探活已发出。早于此到达的 `hello` 全是上一次的迟到回执，
                    // 那时订阅还不存在，天然不会误认；此后的仍要比对 `t`，防的是「上一条
                    // 迟到回执恰好落在本订阅之后、本条回执之前」。
                    this.transport.on('hello', (f) => {
                        if (f.t === id) finish('hello');
                    }, { signal: ac.signal });
                    this.transport.sendFrame({ type: 'hello', t: id });
                    console.warn('[FILE] cancel 回执超时，发 hello 探活 t=' + id);
                    timer = setTimeout(() => {
                        console.warn('[FILE] hello 探活也超时，取消按本地判定收尾');
                        finish('timeout');
                    }, helloLimit);
                };
                // ⚠️ 订阅先于发帧 —— 本函数的 executor 是**同步**跑的，所以 _cancel 里
                // 「先拿到这个 Promise，再发 cancel 帧」就能保证回执不会漏（局域网一个
                // 来回只要几毫秒，先发后订必然偶尔漏掉，界面就白锁到超时）。
                this.transport.on('ack', (f) => {
                    if (f.ref === kind && f.id === id && f.a === 'cancel') finish('ack');
                }, { signal: ac.signal });
                // 断连：服务端侧的会话会随连接一起清掉（abort_all），就地放行
                this.transport.on(WS_CLOSE, () => finish('offline'), { signal: ac.signal });
                timer = setTimeout(probe, ackLimit);
            });
        }

        /** 取消在飞时的进度区：文案切「正在取消…」，取消按钮置灰防重复点 */
        _renderCancelPending() {
            this.cancelBtn.disabled = true;
            this.fillEl.style.width = this._shownPct + '%';
            this.pctEl.textContent = this._shownPct + '% · ' + t('panel_file_canceling');
            if (this.speedEl) this.speedEl.textContent = '';
        }

        /**
         * 收尾并写入结果气泡。
         *
         * result：true = PC 已确认落盘；false = 明确失败（error 帧 / 断连 / 发送中断）；
         *         'unknown' = 保险超时，PC 一直没表态（既不谎报成功，也不谎报失败）。
         */
        _finish(result) {
            const file = this._file;
            // 已被 _cancel 接管（它摘掉 _file 并负责解锁与气泡）：这里直接退出，
            // 否则会把界面提前解锁，取消回执的等待就失去意义
            if (!file) return;
            const kind = this._kind;
            // 收尾 = 本次传输作用域结束：还挂在停等闸门上的等待就地退出（ACK 不会再来了）
            if (this._tx) this._tx.abort();
            this._resetUI();
            this._state = 'idle';
            this._setLock(false);
            if (result === true) {
                // 完成：file 深绿、photo 也用深绿，靠文案/图标（📄/🖼️）区分
                // 全程平均速率 = 总字节 ÷ 总耗时（从开始发送到落盘确认），KB/s ↔ MB/s 自动切换
                const elapsed = (performance.now() - this._startT) / 1000;   // 秒
                const avgBps = elapsed > 0 ? file.size / elapsed : 0;
                const speedText = avgBps > 0 ? FilePanel._formatSpeed(avgBps) : '';
                this.chat.addFileMessage(
                    t(this._bubbleKey('done'), { name: file.name, speed: speedText }),
                    'done', null, kind);
                return;
            }
            // 失败与「未确认」共用灰色气泡样式；file 可点重发（核对后没到就重发），photo 纯结果展示
            const ref = kind === 'file' ? file : null;
            const key = result === 'unknown' ? 'unknown' : 'failed';
            this.chat.addFileMessage(t(this._bubbleKey(key), { name: file.name }), 'cancel', ref, kind);
        }

        _resetUI() {
            this.progressBox.hidden = true;
            this.pickRow.style.display = '';
            this.cancelBtn.disabled = false;   // 取消在飞时会置灰，收尾必须复原
            this._file = null;
            this._awaitingAck = false;
            if (this.speedEl) this.speedEl.textContent = '';
        }

        /** 只重绘进度（百分比取自 _shownPct），文案随「是否在等 end ack」切换 */
        _renderPct() {
            this.fillEl.style.width = this._shownPct + '%';
            this.pctEl.textContent = this._awaitingAck
                ? this._shownPct + '% · ' + t('panel_file_finalizing')
                : this._shownPct + '%';
        }

        _updateProgress(received) {
            const file = this._file;
            if (!file || !file.size) return;
            let pct = Math.round((Math.min(Math.max(0, received), file.size) / file.size) * 100);
            // 100% 只由 end ack 解锁（见 ws.on('ack')）：数据「已发出」不等于「PC 已落盘」，
            // 提前满格正是「手机说成功、PC 还在写」的观感来源
            if (pct >= 100 && !this._endConfirmed) pct = 99;
            this._shownPct = Math.max(this._shownPct, pct);   // 单调不减：背压会让本地估算回落
            this._renderPct();
        }

        /**
         * 记录每块 data ack 的累计字节与时间，据此推算**端到端**速率。
         *
         * 速率 = (ack(n).received − ack(n−MAX_INFLIGHT).received) ÷ (两次 ack 的真实时间差)。
         * 分子正好是「在途窗口」那 MAX_INFLIGHT 块被 PC 端确认所收到的字节，分母是这段
         * 时间——它量的是「PC 真正收完一个窗口」的吞吐，不受本地 bufferedAmount 盲区影响
         * （bufferedAmount 只覆盖浏览器→网络栈，再往后全是盲区）。`performance.now()` 单调，
         * 比 `Date.now()` 不受系统时间回拨干扰。
         *
         * 前 MAX_INFLIGHT 块尚无「窗口起点」可对照，此时算不出速率（显示留空）；之后每块
         * 刷新一次。低水位条目及时删除，避免随块数无限增长。
         */
        _recordAck(n, received) {
            const now = performance.now();
            const log = this._ackLog;
            log.set(n, { received, t: now });
            const old = log.get(n - FilePanel.MAX_INFLIGHT);
            if (old) {
                const dt = (now - old.t) / 1000;     // 秒
                const db = received - old.received;   // 字节
                if (dt > 0 && db > 0) {
                    this._speed = db / dt;           // 字节/秒
                    this._renderSpeed();
                }
            }
            // 只保留窗口所需的旧条目（n − MAX_INFLIGHT 这一档），更早的已无用
            for (const k of log.keys()) {
                if (k < n - FilePanel.MAX_INFLIGHT) log.delete(k);
            }
        }

        /** 把当前速率刷到进度区（KB/s ↔ MB/s 自动切换）。无速率时留空。 */
        _renderSpeed() {
            if (this.speedEl) {
                this.speedEl.textContent = this._speed > 0
                    ? FilePanel._formatSpeed(this._speed) : '';
            }
        }

        /** 速率格式化：≥ 1 MB/s 显示 MB/s，否则显示 KB/s（1024 进制），保留 1 位小数。 */
        static _formatSpeed(bps) {
            if (bps >= 1024 * 1024) return (bps / (1024 * 1024)).toFixed(1) + ' MB/s';
            return (bps / 1024).toFixed(1) + ' KB/s';
        }
    }

    // ========== 6.5 输入历史（与 PC 主界面读同一份 SQLite） ==========
    // 历史库由服务端写入；这里只读。路径必须**相对页面目录**：
    // 加密模式下页面在 /{secret}/ 下，绝对 /api/history 会丢掉 secret 前缀而 404。
    const HISTORY_API = 'api/history';

    async function fetchHistory(limit = 30, offset = 0) {
        const url = HISTORY_API + '?limit=' + encodeURIComponent(limit)
            + '&offset=' + encodeURIComponent(offset);
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
    }
    window._pmFetchHistory = fetchHistory;

    /** 打开页面时把最近的历史铺回聊天区（最新在前 → 反过来按时间顺序追加）。 */
    async function restoreRecentHistory(chatManager) {
        try {
            if (chatManager.getAllMessages().length) return;
            // 走可替换入口：测试与离线预览都靠替换它避免真发请求
            var reader = window._pmFetchHistory || fetchHistory;
            const data = await reader(20, 0);
            const rows = (data.messages || []).slice().reverse();
            rows.forEach((m) => chatManager.addMessage(m.text, {
                created_at: m.created_at,
                chars: m.chars,
                historyId: m.id,
            }));
        } catch (e) {
            // 历史是增强信息：读不到不影响连接与输入
            console.debug('[History] restore skipped:', e && e.message);
        }
    }

    // ========== 7. 主程序入口 ==========
    window.onload = async () => {
        await loadI18n();   // 必须先加载语言包，再初始化各组件

        const chatContainer = document.getElementById('chat-list');
        const inputBox = document.getElementById('input-box');
        const btnSend = document.getElementById('btn-send');
        const btnClear = document.getElementById('btn-clear');
        const modeToggle = document.getElementById('mode-toggle');

        const chatManager = new ChatListManager(chatContainer, appConfig);
        window.chatManagerInstance = chatManager;

        // 附件面板：子面板切换条（依赖语言包，必须在 loadI18n() 之后）
        initPanelTabs();

        const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        // 跟随当前页面路径：加密模式页面在 /{secret}/ 下 → /{secret}/ws；明文模式在 / 下 → /ws
        const wsClient = new WSClient(`${wsProto}//${location.host}${location.pathname}ws`, appConfig);
        const uiController = new UIController(inputBox, btnSend, btnClear, modeToggle, chatManager, wsClient, appConfig);

        // 鼠标子面板：虚拟摇杆（速度模型）+ 4×4 动作按钮网格。
        // 触控板子面板：单指移动 / 轻点 / 双指滚动，自带按钮；与鼠标并列的独立面板。
        // 两者都只用 onCommand(frame) 作为唯一出口（docs/mouse-joystick-design.md §3.2），
        // 帧字段平铺在顶层，原样交给 wsClient；未连接时 sendFrame 静默返回 false。
        window._mouseJoystick = new MouseJoystick(document.getElementById('view-mouse'), {
            onCommand: (frame) => wsClient.sendFrame(frame)
        });
        window._touchpad = new TouchpadPanel(document.getElementById('view-touchpad'), {
            onCommand: (frame) => wsClient.sendFrame(frame)
        });
        // 键盘子面板：组合快捷键（编辑/导航/系统），同样只走 onCommand 单一出口
        window._keyboard = new KeyboardPanel(document.getElementById('view-keys'), {
            onCommand: (frame) => wsClient.sendFrame(frame)
        });
        // 文件子面板：发送文件到 PC。**唯一直接拿传输层对象的面板**——它既要发帧，也要
        // 订阅下行 ack/hello/error 与连接态（理由见 §6.5 类头注释）。
        // revealPanel：发送开始时若附件面板收起则展开、并切到文件 tab，保证用户能看到进度/取消。
        window._filePanel = new FilePanel(document.getElementById('view-file'), {
            transport: wsClient,
            chat: chatManager,
            revealPanel: () => {
                const ap = window._accessoryPanel;
                if (ap && !ap.isVisible) uiController.showAccessoryPanel();  // 展开并露出切换条
                if (window._activatePanel) window._activatePanel('file');    // 切到文件 tab
                if (window._adjustViewport) window._adjustViewport();
            },
            // 传输期间锁死：切面板/收发文本/展开收起一律禁用并灰显
            setTransferLock: (locked) => {
                document.body.classList.toggle('file-transferring', !!locked);
                // 传输期间暂停探活：停等 ack 本身在刷新下行，传输另有超时兜底
                wsClient.setProbePaused(locked);
                ['btn-plus', 'btn-send', 'btn-clear', 'input-box'].forEach((id) => {
                    const el = document.getElementById(id);
                    if (el) el.disabled = !!locked;
                });
                document.querySelectorAll('#panel-tabs .tab').forEach((b) => { b.disabled = !!locked; });
            }
        });

        new MessageInteractionManager(chatContainer, uiController, wsClient);

        // 断线恢复的两条快路径：都把重连窗口从「1s 起」压到「立即」
        //   ① network online —— Wi-Fi/蜂窝切回来
        //   ② 页面回前台 —— Android WebView 切后台（唤起文件选择器、熄屏、被别的 Activity
        //      顶掉）期间系统常顺手掐掉 socket，两端都收不到关闭帧、只剩一个 1006
        // 注意走 resumeVerify 而不是裸 reconnectNow：这两种时刻 socket 常常**看起来还
        // 开着**（readyState 仍是 OPEN），直接重连会被 readyState 挡住，得先探一帧。
        window.addEventListener('online', () => {
            console.debug('[NET] Network online, verifying link');
            wsClient.resumeVerify('online');
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) wsClient.resumeVerify('visible');
        });

        wsClient.on('config', (data) => {
            if (data.mobile_max_records !== undefined) {
                appConfig.set('maxHistory', data.mobile_max_records);
                console.debug(t('log_config_updated') + data.mobile_max_records);
            }
            // 发送方式：双向 config。首帧把 PC 的设置带回（换机/清缓存后不丢），
            // 手机点分段控件的上行回声也走这里，以 PC 真实值为准自愈。
            // 空值=从未配置，不干预手机端当前选择。
            if (data.mobile_send_mode !== undefined && data.mobile_send_mode !== '') {
                uiController.setAutoMode(data.mobile_send_mode === 'auto');
                console.debug('[Config] send mode = ' + data.mobile_send_mode);
            }
            // 服务端单帧上限 → 收紧文件分块（未下发时用 CHUNK_MAX，随链路取值）
            if (data.max_frame_size !== undefined) FilePanel.setServerMaxFrame(data.max_frame_size);
        });
        wsClient.on('send', (data) => console.debug("[WS] 收到 send 回声:", data));
        // 应用层心跳应答（wire-protocol.md §7）：服务端只在「空闲」时才发 ping，
        // 传输中数据帧本身就在刷新它的存活时间戳，因此不会打扰上传。
        // 回一帧 pong 即证明本端仍在线；sendFrame 自带断连 guard，无需额外保护。
        wsClient.on('ping', () => wsClient.sendFrame({ type: 'pong' }));
        // 我们自己的探针回音（wire-protocol.md §7）。判定已在传输层做完——收到任意
        // 下行帧就算续命——这里只留一行诊断，顺便让它别落进「未知类型」告警。
        wsClient.on('pong', () => console.debug('[WS] pong', `rtt=${wsClient.lastRtt()}ms`));
        // PC 端配置变更（如切换加密开关）：URL 已变化，停止自动重连并提示重新扫码
        wsClient.on('reconnect', (data) => {
            if (data && data.reason === 'config_changed') {
                wsClient.authRejected = true;
                wsClient._showRescanRequired();
                if (wsClient.ws) wsClient.ws.close();
            }
        });

        // 初始化安全通道（从 URL 提取 PC 公钥 + 生成手机密钥对）
        uiController.onConnectionChange(false, t('status_loading_text'), 'loading');
        try {
            await wsClient.secure.init();
        } catch (e) {
            console.error('[SEC] Init failed:', e);
            uiController.onConnectionChange(false, t('status_load_failed_text'));
            return;
        }

        uiController.onConnectionChange(false, t('status_connecting_text'), 'loading');
        wsClient.connect();
        chatManager.scrollToBottom();
        // 页面一打开就把最近的历史铺回聊天区，随后新消息继续追加（不重复）
        restoreRecentHistory(chatManager);
    };
</script>

            if (themeMode === 'dark') return 'dark';
            if (themeMode === 'light') return 'light';
            return (mqDark && mqDark.matches) ? 'dark' : 'light';
        }
        function themeLabel(mode) {
            if (mode === 'light') return T('theme_mode_light', '主题：浅色');
            if (mode === 'dark') return T('theme_mode_dark', '主题：深色');
            return T('theme_mode_auto', '主题：跟随系统');
        }
        function applyTheme() {
            var resolved = resolvedTheme();
            document.documentElement.setAttribute('data-pm-theme', resolved);
            document.documentElement.setAttribute('data-pm-theme-mode', themeMode);
            var btn = document.getElementById('pm-theme-btn');
            if (btn) {
                btn.innerHTML = themeMode === 'light' ? ICONS.sun : themeMode === 'dark' ? ICONS.moon : ICONS.auto;
                btn.setAttribute('aria-label', themeLabel(themeMode));
                btn.title = themeLabel(themeMode);
                btn.dataset.mode = themeMode;
            }
            var meta = document.querySelector('meta[name="theme-color"]');
            if (!meta) {
                meta = document.createElement('meta');
                meta.setAttribute('name', 'theme-color');
                document.head.appendChild(meta);
            }
            meta.setAttribute('content', resolved === 'dark' ? '#0b0c0e' : '#f7f7f9');
        }

        /* ---------- 顶部导航 + 状态胶囊 ---------- */
        function buildNav() {
            if (document.getElementById('pm-nav')) return;
            var app = document.getElementById('app');
            if (!app) return;
            var nav = document.createElement('header');
            nav.id = 'pm-nav';
            nav.innerHTML =
                '<div class="pm-brand">' +
                    '<span class="pm-logo">' + ICONS.logo + '</span>' +
                    '<span class="pm-word">PhoneMic</span>' +
                '</div>' +
                '<div class="pm-island" data-state="connecting" role="status" aria-live="polite">' +
                    '<span class="pm-dot"></span><span class="pm-island-text"></span>' +
                '</div>' +
                '<button id="pm-theme-btn" type="button" class="pm-icon-btn"></button>';
            app.insertBefore(nav, app.firstChild);

            var themeBtn = document.getElementById('pm-theme-btn');
            themeBtn.addEventListener('click', function () {
                themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
                try { localStorage.setItem(THEME_KEY, themeMode); } catch (e) {}
                applyTheme();
                if (navigator.vibrate) navigator.vibrate(8);
            });
            applyTheme();
            syncIsland();
        }

        function syncIsland() {
            var island = document.querySelector('#pm-nav .pm-island');
            if (!island) return;
            var bar = document.getElementById('status-bar');
            var state = 'connected';
            if (bar) {
                var visible = window.getComputedStyle(bar).display !== 'none';
                if (visible) state = bar.classList.contains('loading') ? 'connecting' : 'disconnected';
            }
            island.dataset.state = state;
            var text = island.querySelector('.pm-island-text');
            if (text) {
                text.textContent = state === 'connected'
                    ? T('hdr_connected', '已连接')
                    : state === 'connecting'
                        ? T('hdr_connecting', '连接中')
                        : T('hdr_disconnected', '已断开');
            }
        }

        /* ---------- 空态引导 ---------- */
        var EMPTY_ROWS = [
            { id: 'keys',     icon: 'keys',     title: 'panel_tab_keys',     sub: 'panel_hint_keys',     fbT: '键盘',   fbS: '组合快捷键' },
            { id: 'touchpad', icon: 'touchpad', title: 'panel_tab_touchpad', sub: 'panel_hint_touchpad', fbT: '触控板', fbS: '滑动 / 轻点 / 双指滚动' },
            { id: 'mouse',    icon: 'mouse',    title: 'panel_tab_mouse',    sub: 'panel_hint_mouse',    fbT: '鼠标',   fbS: '摇杆移动 · 点击 / 滚轮' },
            { id: 'file',     icon: 'file',     title: 'panel_tab_file',     sub: 'panel_hint_file',     fbT: '文件',   fbS: '发送到电脑 Downloads/PhoneMic' }
        ];

        function buildEmpty() {
            if (document.getElementById('pm-empty')) return;
            var chat = document.getElementById('chat-list');
            if (!chat) return;
            var wrap = document.createElement('div');
            wrap.id = 'pm-empty';
            var rowsHtml = EMPTY_ROWS.map(function (r) {
                return '<button type="button" class="pm-row" data-pm-panel="' + r.id + '">' +
                    '<span class="pm-tile">' + ICONS[r.icon] + '</span>' +
                    '<span class="pm-row-text">' +
                        '<span class="pm-row-title" data-pm-i18n="' + r.title + '" data-fb="' + r.fbT + '">' + r.fbT + '</span>' +
                        '<span class="pm-row-sub" data-pm-i18n="' + r.sub + '" data-fb="' + r.fbS + '"' +
                            (r.id === 'file' ? '' : ' data-pm-strip="1"') + '>' + r.fbS + '</span>' +
                    '</span>' +
                    '<span class="pm-chev">' + ICONS.chev + '</span>' +
                '</button>';
            }).join('');
            wrap.innerHTML =
                '<div class="pm-head pm-empty-head">' +
                    '<div class="pm-badge">' + ICONS.wave + '</div>' +
                    '<div class="pm-tagline" data-pm-i18n="hdr_tagline" data-fb="语音 · 键鼠 · 文件，无线直达电脑">语音 · 键鼠 · 文件，无线直达电脑</div>' +
                    '<div class="pm-title" data-pm-i18n="empty_title" data-fb="对着手机说话，文字飞进电脑">对着手机说话，文字飞进电脑</div>' +
                    '<div class="pm-sub" data-pm-i18n="empty_sub" data-fb="语音识别后自动发送到电脑光标处；也可以当键盘、触控板，或把文件快传到电脑">语音识别后自动发送到电脑光标处；也可以当键盘、触控板，或把文件快传到电脑</div>' +
                '</div>' +
                '<div class="pm-group">' + rowsHtml + '</div>';

            var spacer = document.getElementById('chat-spacer');
            if (spacer) chat.insertBefore(wrap, spacer); else chat.appendChild(wrap);

            wrap.querySelectorAll('.pm-row').forEach(function (row) {
                row.addEventListener('click', function () {
                    var plus = document.getElementById('btn-plus');
                    var ap = window._accessoryPanel;
                    if (plus && plus.disabled) {
                        if (typeof showToast === 'function') showToast(T('status_disconnected_text', '已断开连接，正在重连...'));
                        return;
                    }
                    if (ap && !ap.isVisible && plus) plus.click();
                    if (window._activatePanel) window._activatePanel(row.dataset.pmPanel);
                    syncSegPill();
                    if (navigator.vibrate) navigator.vibrate(10);
                });
            });

            syncEmpty();
            if (typeof MutationObserver !== 'undefined') {
                new MutationObserver(syncEmpty).observe(chat, { childList: true });
            }
        }

        function syncEmpty() {
            var chat = document.getElementById('chat-list');
            var empty = document.getElementById('pm-empty');
            if (!chat || !empty) return;
            var has = chat.querySelector('.message') !== null;
            empty.classList.toggle('pm-hide', has);
            chat.classList.toggle('pm-empty', !has);
            if (!has) syncFill();
        }

        function syncFill() {
            document.querySelectorAll('#pm-empty [data-pm-i18n]').forEach(function (el) {
                var key = el.getAttribute('data-pm-i18n');
                var fb = el.getAttribute('data-fb') || key;
                var val = T(key, fb);
                if (val && el.getAttribute('data-pm-strip')) {
                    // 面板提示自带“键盘面板 · ”这类前缀，空态行已有标题，去掉避免重复
                    val = val.replace(/^[^·]{1,16}?\s*·\s*/, '');
                }
                if (val && val !== el.textContent) el.textContent = val;
            });
            syncIsland();
        }

        /* ---------- 面板展开状态（同步空态显隐） ---------- */
        function syncPanelState() {
            var app = document.getElementById('app');
            var ap = document.getElementById('accessory-panel');
            if (!app || !ap) return;
            var open = (parseFloat(ap.style.height) || 0) > 8 ||
                (window._accessoryPanel && window._accessoryPanel.isVisible);
            app.classList.toggle('pm-panel-open', !!open);
        }

        /* ---------- 分段控件：图标 + 文案 + 滑动指示块 ---------- */
        function decorateTabs() {
            var tabs = document.getElementById('panel-tabs');
            if (!tabs) return;
            if (!document.getElementById('pm-seg-pill')) {
                var pill = document.createElement('span');
                pill.id = 'pm-seg-pill';
                tabs.insertBefore(pill, tabs.firstChild);
            }
            var tabEls = Array.prototype.slice.call(tabs.querySelectorAll('.tab'));
            if (!tabEls.length) return;
            tabEls.forEach(function (tab) {
                var ico = tab.querySelector('.ico');
                if (ico && !ico.dataset.pmSvg) {
                    ico.innerHTML = ICONS[tab.dataset.panel] || '';
                    ico.dataset.pmSvg = '1';
                }
                if (!tab.querySelector('.lbl')) {
                    var lbl = document.createElement('span');
                    lbl.className = 'lbl';
                    lbl.dataset.pmTab = tab.dataset.panel;
                    tab.appendChild(lbl);
                }
                var lblEl = tab.querySelector('.lbl');
                if (lblEl) lblEl.textContent = T('panel_tab_' + tab.dataset.panel, tab.dataset.panel);
            });
            syncSegPill();
        }

        function syncSegPill() {
            var tabs = document.getElementById('panel-tabs');
            var pill = document.getElementById('pm-seg-pill');
            if (!tabs || !pill) return;
            var active = tabs.querySelector('.tab.active');
            if (!active) return;
            var tr = tabs.getBoundingClientRect();
            var ar = active.getBoundingClientRect();
            if (!ar.width) return;
            pill.style.width = ar.width + 'px';
            pill.style.transform = 'translateX(' + (ar.left - tr.left - 3.5) + 'px)';
        }

        /* ---------- 输入历史抽屉 ---------- */
        var historyState = { loaded: false, loading: false, offset: 0, messages: [], stats: null };
        window._pmInvalidateHistory = function () { historyState.loaded = false; };

        function buildHistorySheet() {
            if (document.getElementById('pm-history-sheet')) return;
            var sheet = document.createElement('div');
            sheet.id = 'pm-history-sheet';
            sheet.innerHTML =
                '<div id="pm-history-backdrop"></div>' +
                '<div id="pm-history-panel" role="dialog" aria-modal="true">' +
                    '<div class="pm-history-head">' +
                        '<span class="pm-history-title"></span>' +
                        '<span class="pm-history-stats"></span>' +
                        '<button id="pm-history-close" type="button">✕</button>' +
                    '</div>' +
                    '<div id="pm-history-list"></div>' +
                    '<button id="pm-history-more" type="button"></button>' +
                '</div>';
            document.body.appendChild(sheet);
            document.getElementById('pm-history-backdrop').addEventListener('click', closeHistory);
            document.getElementById('pm-history-close').addEventListener('click', closeHistory);
            document.getElementById('pm-history-more').addEventListener('click', function () {
                loadHistory(false);
            });
        }

        function fillHistoryLabels() {
            var sheet = document.getElementById('pm-history-sheet');
            if (!sheet) return;
            sheet.querySelector('.pm-history-title').textContent = T('history_title', '输入历史');
            sheet.querySelector('#pm-history-close').setAttribute(
                'aria-label', T('history_close', '关闭'));
            sheet.querySelector('#pm-history-more').textContent =
                T('history_load_more', '加载更多');
        }

        function openHistory() {
            buildHistorySheet();
            fillHistoryLabels();
            var sheet = document.getElementById('pm-history-sheet');
            if (!sheet) return;
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            sheet.classList.add('open');
            if (historyState.loaded) renderHistory();
            else loadHistory(true);
        }

        function closeHistory() {
            var sheet = document.getElementById('pm-history-sheet');
            if (sheet) sheet.classList.remove('open');
        }

        async function loadHistory(reset) {
            if (historyState.loading) return;
            historyState.loading = true;
            var list = document.getElementById('pm-history-list');
            var more = document.getElementById('pm-history-more');
            if (reset) {
                historyState.offset = 0;
                historyState.messages = [];
                historyState.stats = null;
            }
            if (list) {
                list.innerHTML = '';
                var tip = document.createElement('div');
                tip.className = 'pm-history-empty';
                tip.textContent = T('history_loading', '加载中…');
                list.appendChild(tip);
            }
            if (more) more.style.display = 'none';
            try {
                if (typeof window._pmFetchHistory !== 'function') throw new Error('history api missing');
                var data = await window._pmFetchHistory(30, historyState.offset);
                var batch = data.messages || [];
                historyState.messages = historyState.messages.concat(batch);
                historyState.offset += batch.length;
                historyState.stats = data.stats || null;
                historyState.loaded = true;
                renderHistory();
            } catch (e) {
                if (list) {
                    list.innerHTML = '';
                    var err = document.createElement('div');
                    err.className = 'pm-history-empty';
                    err.textContent = T('history_load_failed', '读取历史失败');
                    list.appendChild(err);
                }
            } finally {
                historyState.loading = false;
            }
        }

        function renderHistory() {
            var list = document.getElementById('pm-history-list');
            var more = document.getElementById('pm-history-more');
            if (!list) return;
            list.innerHTML = '';
            if (!historyState.messages.length) {
                var empty = document.createElement('div');
                empty.className = 'pm-history-empty';
                empty.textContent = T('history_empty', '还没有输入记录');
                list.appendChild(empty);
            } else {
                historyState.messages.forEach(function (m) {
                    var row = document.createElement('div');
                    row.className = 'pm-history-row';
                    var meta = document.createElement('div');
                    meta.className = 'pm-history-meta';
                    var time = document.createElement('span');
                    time.textContent = ChatListManager.formatTime(m.created_at);
                    var chars = document.createElement('span');
                    chars.className = 'chars';
                    chars.textContent = (m.chars || 0) + ' ' + T('history_chars_unit', '字');
                    meta.appendChild(time);
                    meta.appendChild(chars);
                    var text = document.createElement('div');
                    text.className = 'pm-history-text';
                    text.textContent = m.text || '';
                    row.appendChild(meta);
                    row.appendChild(text);
                    list.appendChild(row);
                });
            }
            var stats = document.querySelector('#pm-history-sheet .pm-history-stats');
            if (stats) {
                var s = historyState.stats || { total: historyState.messages.length, total_chars: 0 };
                stats.textContent = T('history_stats', '{total} 条 · {chars} 字')
                    .replace('{total}', s.total).replace('{chars}', s.total_chars);
            }
            if (more) {
                var total = historyState.stats ? historyState.stats.total : historyState.messages.length;
                more.style.display = historyState.offset < total ? 'block' : 'none';
            }
        }

        /* ---------- 输入坞：清空按钮 / 模式图标 ---------- */
        function decorateDock() {
            var clear = document.getElementById('btn-clear');
            if (clear && !clear.dataset.pmIcon) {
                clear.innerHTML = ICONS.delete;
                clear.dataset.pmIcon = '1';
            }
            var mode = document.getElementById('mode-toggle');
            if (mode && !mode.dataset.pmIcon) {
                mode.innerHTML = ICONS.bolt;
                mode.dataset.pmIcon = '1';
                mode.setAttribute('aria-label', T('btn_send_auto', '自动'));
            }
            // 常显分段控件的文案（UIController 也会按当前模式再刷一次选中态）
            document.querySelectorAll('#send-mode-seg button').forEach(function (btn) {
                btn.textContent = btn.dataset.sendMode === 'auto'
                    ? T('send_mode_auto', '自动发送')
                    : T('send_mode_manual', '手动发送');
            });
            var sel = document.getElementById('btn-select-all');
            if (sel) {
                sel.textContent = T('btn_select_all', '全选');
                sel.setAttribute('aria-label', T('btn_select_all_aria', '全选输入框文字'));
            }
            var historyBtn = document.getElementById('btn-history');
            if (historyBtn) {
                historyBtn.textContent = T('btn_history', '历史');
                historyBtn.setAttribute('aria-label', T('btn_history_aria', '查看输入历史'));
                if (!historyBtn.dataset.pmBound) {
                    historyBtn.dataset.pmBound = '1';
                    historyBtn.addEventListener('click', openHistory);
                }
            }
        }

        /* ---------- 文件面板图标 ---------- */
        function decorateFilePanel() {
            var pick = document.querySelector('#view-file .fp-pick');
            if (!pick) return;
            var map = { doc: 'doc', image: 'image' };
            pick.querySelectorAll('button[data-fp]').forEach(function (btn) {
                var ico = btn.querySelector('.ico');
                if (ico && !ico.dataset.pmSvg) {
                    ico.innerHTML = ICONS[map[btn.dataset.fp]] || ICONS.doc;
                    ico.dataset.pmSvg = '1';
                }
            });
        }

        /* ---------- 审批浮层的锁标 ---------- */
        function decorateApproval() {
            var overlay = document.getElementById('approval-overlay');
            if (!overlay || overlay.querySelector('.pm-approval-lock')) return;
            var lock = document.createElement('div');
            lock.className = 'pm-approval-lock';
            lock.innerHTML = ICONS.lock;
            overlay.insertBefore(lock, overlay.firstChild);
        }

        /* ---------- 键盘按键放大镜 ---------- */
        var keypopTimer = null;
        function ensureKeypop() {
            if (document.getElementById('pm-keypop')) return;
            var el = document.createElement('div');
            el.id = 'pm-keypop';
            el.setAttribute('aria-hidden', 'true');
            document.body.appendChild(el);
        }
        function showKeypop(btn) {
            ensureKeypop();
            var el = document.getElementById('pm-keypop');
            var label = (btn.textContent || '').trim();
            if (!label) return;
            el.textContent = label;
            var r = btn.getBoundingClientRect();
            el.style.left = (r.left + r.width / 2) + 'px';
            el.style.top = (r.top - 8) + 'px';
            el.classList.add('show');
            clearTimeout(keypopTimer);
            keypopTimer = setTimeout(hideKeypop, 1200);
        }
        function hideKeypop() {
            var el = document.getElementById('pm-keypop');
            if (el) el.classList.remove('show');
        }
        function bindKeypop() {
            var view = document.getElementById('view-keys');
            if (!view || view.dataset.pmKeypop) return;
            view.dataset.pmKeypop = '1';
            view.addEventListener('pointerdown', function (e) {
                var btn = e.target.closest && e.target.closest('.kb-grid button');
                if (btn) showKeypop(btn);
            });
            window.addEventListener('pointerup', hideKeypop, true);
            window.addEventListener('pointercancel', hideKeypop, true);
        }

        /* ---------- 主题实时跟随系统 ---------- */
        if (mqDark) {
            var onScheme = function () { if (themeMode === 'auto') applyTheme(); };
            if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme);
            else if (mqDark.addListener) mqDark.addListener(onScheme);
        }

        /* ---------- 编排：多次幂等执行，覆盖异步初始化完成的时机 ---------- */
        function decorate() {
            buildNav();
            buildEmpty();
            buildHistorySheet();
            fillHistoryLabels();
            decorateTabs();
            decorateDock();
            decorateFilePanel();
            decorateApproval();
            bindKeypop();
            syncFill();
            syncIsland();
            syncSegPill();
            syncPanelState();
        }

        document.addEventListener('DOMContentLoaded', decorate);
        if (document.readyState !== 'loading') decorate();
        window.addEventListener('load', function () {
            decorate();
            [120, 400, 900, 1600, 2600].forEach(function (ms) { setTimeout(decorate, ms); });
        });
        // 面板是 window.onload 里异步建的，补几次兜底轮询（幂等、开销极小）
        var tries = 0;
        var bootTimer = setInterval(function () {
            decorate();
            if (document.getElementById('view-file').children.length &&
                document.getElementById('panel-tabs').querySelector('.lbl')) {
                clearInterval(bootTimer);
            } else if (++tries > 60) {
                clearInterval(bootTimer);
            }
        }, 250);

        // 状态条变化 → 胶囊即时镜像
        window.addEventListener('load', function () {
            var bar = document.getElementById('status-bar');
            if (!bar || typeof MutationObserver === 'undefined') return;
            new MutationObserver(syncIsland).observe(bar, {
                attributes: true, childList: true, characterData: true, subtree: true
            });
        });

        // 切换面板 / 横竖屏 → 指示块跟随
        window.addEventListener('load', function () {
            var tabs = document.getElementById('panel-tabs');
            if (!tabs) return;
            tabs.addEventListener('click', function () { requestAnimationFrame(syncSegPill); });
            if (typeof MutationObserver !== 'undefined') {
                new MutationObserver(function () { requestAnimationFrame(syncSegPill); }).observe(tabs, {
                    attributes: true, subtree: true, attributeFilter: ['class']
                });
            }
            window.addEventListener('resize', syncSegPill);
            window.addEventListener('orientationchange', function () { setTimeout(syncSegPill, 120); });
            syncSegPill();
        });

        // 附件面板高度变化 → 空态显隐同步
        window.addEventListener('load', function () {
            var ap = document.getElementById('accessory-panel');
            if (!ap) return;
            if (typeof MutationObserver !== 'undefined') {
                new MutationObserver(function () { requestAnimationFrame(syncPanelState); }).observe(ap, {
                    attributes: true, attributeFilter: ['style', 'class']
                });
            }
            window.addEventListener('resize', syncPanelState);
            syncPanelState();
        });
    })();
</script>
</body>
</html>
